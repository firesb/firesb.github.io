<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View a Fire Spelling Bee learner profile.">
    <title>Profile - Fire Spelling Bee</title>
    <link rel="icon" type="image/png" href="/EMOJIS/C_bee.png">
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        padding: 24px;
        box-sizing: border-box;
        font-family: "Brush Script MT", "Brush Script Std", "Comic Sans MS", cursive;
        background: #eaff00 url('/fsb_background.png') repeat fixed;
        color: #242424;
      }

      .site-header,
      .site-footer {
        text-align: center;
      }

      .site-header img {
        width: min(220px, 55vw);
        height: auto;
      }

      .profile-card {
        width: min(640px, 100%);
        margin: 24px auto;
        padding: 28px;
        box-sizing: border-box;
        border: 3px solid #e34424;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16);
      }

      h1 {
        margin-top: 0;
        text-align: center;
      }

      #profile-status {
        text-align: center;
      }

      #profile-details[hidden] {
        display: none;
      }

      dl {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
        margin: 24px 0;
      }

      dl div {
        padding: 14px;
        border-radius: 12px;
        background: #fff3c4;
        overflow-wrap: anywhere;
      }

      dt {
        font-weight: bold;
      }

      dd {
        margin: 4px 0 0;
      }

      .home-link {
        display: block;
        width: fit-content;
        margin: 24px auto 0;
        color: #8e210c;
        font-size: 1.15rem;
      }

      @media (max-width: 480px) {
        body {
          padding: 16px;
        }

        .profile-card {
          padding: 20px;
        }
      }
    </style>
    <script defer src="/source/js/profiles.js"></script>
  </head>
  <body>
    <header class="site-header" role="banner">
      <a href="/" aria-label="Fire Spelling Bee home">
        <img src="/logo.png" alt="Fire Spelling Bee">
      </a>
    </header>
    <main class="profile-card" aria-labelledby="profile-title">
      <h1 id="profile-title">Loading profile…</h1>
      <p id="profile-status" role="status" aria-live="polite">Finding this learner’s profile…</p>
      <section id="profile-details" aria-label="Profile details" hidden>
        <dl>
          <div>
            <dt>Username</dt>
            <dd id="profile-username"></dd>
          </div>
          <div>
            <dt>Account type</dt>
            <dd id="profile-account-type"></dd>
          </div>
          <div>
            <dt>Spelling points</dt>
            <dd id="profile-points"></dd>
          </div>
          <div>
            <dt>Experience level</dt>
            <dd id="profile-level"></dd>
          </div>
          <div>
            <dt>Member since</dt>
            <dd id="profile-created"></dd>
          </div>
        </dl>
      </section>
      <a class="home-link" href="/">Back to Fire Spelling Bee</a>
    </main>
    <footer class="site-footer" role="contentinfo">
      <p>&copy; 2026 Fire Spelling Bee. All rights reserved.</p>
    </footer>
  </body>
</html>
